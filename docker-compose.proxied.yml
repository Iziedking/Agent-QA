# Deploy Agent QA BEHIND an existing ingress Caddy.
#
# Use this instead of docker-compose.yml when the VPS already has a Caddy that
# owns ports 80 and 443. This file ships no Caddy and publishes no host ports.
# The app and memory containers run on your ingress Caddy's Docker network, and
# your Caddy reverse-proxies agentsqa.xyz to agentqa-app:9090 by name.
#
# Before bringing it up:
#   1. Set `name:` under networks.edge to your ingress Caddy's network. Find it
#      with `docker network ls` (it is the network your Caddy container is on).
#   2. Put MEMWAL_PRIVATE_KEY and MEMWAL_ACCOUNT_ID in a gitignored .env here,
#      plus OKX_API_KEY / OKX_SECRET_KEY / OKX_PASSPHRASE / X402_PAY_TO for the
#      paid lane (see deploy.md).
#   3. Add the agentsqa.xyz site block to your ingress Caddyfile (see deploy.md),
#      routing /x402/* and /agon/manifest.json to agentqa-pay:9100,
#      /agon/v1/* to agentqa-memory:4000, and everything else to agentqa-app:9090.
#
# This is the file that deploys agentsqa.xyz. `docker compose up -d` WITHOUT
# `-f docker-compose.proxied.yml` picks up docker-compose.yml instead, which
# ships its own Caddy, cannot bind ports 80/443 (the ingress owns them), and
# recreates agentqa-app on the wrong network — which takes the site down.
#
# Bring up:  docker compose -f docker-compose.proxied.yml up -d --build

services:
  app:
    build: .
    container_name: agentqa-app
    restart: unless-stopped
    # No published ports. The ingress Caddy reaches this at agentqa-app:9090 on
    # the shared edge network; the app talks to memory on the internal network.
    environment:
      - AGENT_MEMORY_URL=http://agentqa-memory:4000
    depends_on:
      - memory
    mem_limit: 512m
    cpus: 1.0
    networks:
      - edge
      - internal

  pay:
    build: ./pay
    container_name: agentqa-pay
    restart: unless-stopped
    # The paid lane for OKX marketplace buyers. No published ports: the ingress
    # Caddy reaches it at agentqa-pay:9100 on the shared edge network and routes
    # /x402/* here, while everything else still goes to agentqa-app. It forwards
    # the paid call to the app over the internal network, so the free console and
    # the paid lane share one implementation of the memory.
    environment:
      - APP_URL=http://agentqa-app:9090
      # OKX facilitator credentials. The service refuses to start without these
      # rather than failing halfway through a buyer's payment.
      - OKX_API_KEY=${OKX_API_KEY:-}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY:-}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE:-}
      # X Layer mainnet, matching the fee denomination on the marketplace
      # listing. The address that receives payment has no default on purpose.
      - X402_NETWORK=${X402_NETWORK:-eip155:196}
      - X402_PAY_TO=${X402_PAY_TO:-}
      # Must match the fee on the listing.
      - X402_PRICE=${X402_PRICE:-}
      # Optional AGON Arc Testnet lane. It stays unavailable until the recipient
      # and explicit enable flag are set in the gitignored production .env.
      - AGON_X402_ENABLED=${AGON_X402_ENABLED:-false}
      - AGON_X402_PAY_TO=${AGON_X402_PAY_TO:-}
      - AGON_X402_PRICE=${AGON_X402_PRICE:-$0.01}
    depends_on:
      - app
    mem_limit: 256m
    cpus: 0.5
    networks:
      - edge
      - internal

  memory:
    build: ./memory-svc
    container_name: agentqa-memory
    restart: unless-stopped
    # Internal only. Reachable by the app, never by the ingress or the internet.
    environment:
      # Identities this service refuses to serve (comma separated), for
      # retiring a compromised or abandoned identity. Set in the same .env.
      - AGENT_MEMORY_RETIRED_USERS=${AGENT_MEMORY_RETIRED_USERS:-}
      # The wallet that pays for everything on Walrus: notes, files, and the
      # gas behind both. Without it the sidecar reports memory disabled rather
      # than quietly keeping notes on a container's disk.
      - WALRUS_SUI_KEY=${WALRUS_SUI_KEY:-}
      # MUST be mainnet. The module defaults to testnet, where blobs are cheap
      # and short-lived, and where all 36 of our earlier file blobs expired
      # unrecoverably. A missing value here is a silent data-loss setting.
      - WALRUS_NETWORK=${WALRUS_NETWORK:-mainnet}
      # 0G Storage is the failover for FILE writes only, when a Walrus file
      # write fails. Notes never touch it.
      - ZERO_G_PRIVATE_KEY=${ZERO_G_PRIVATE_KEY:-}
      # How often the write-ahead buffer is batched into one Walrus quilt.
      # Six hours by default: one flush costs the same whatever it carries
      # (0.2994 WAL + 0.0100 SUI measured on mainnet), so this is the cost dial.
      - AGENT_MEMORY_FLUSH_INTERVAL_MS=${AGENT_MEMORY_FLUSH_INTERVAL_MS:-}
    mem_limit: 512m
    cpus: 0.5
    # The write-ahead buffer, the read cache, and the quilt index. Losing this
    # volume costs anything not yet flushed; the cache and index rebuild from
    # Walrus on the next start.
    volumes:
      - agentqa_memdata:/svc/data
    networks:
      - edge
      - internal

volumes:
  agentqa_memdata:

networks:
  # The existing ingress Caddy's network (arcrun-caddy is attached to this).
  edge:
    external: true
    name: deploy_default
  internal:
    driver: bridge
