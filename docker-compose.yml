# Three services on one host: the app, the memory sidecar, and Caddy
# in front. Caddy is the only service exposed to the internet. It terminates
# HTTPS and forwards to the app over the internal network, so the app never
# speaks TLS and never publishes a port to the host. The memory sidecar is
# internal only; the app reaches it at memory:4000.

services:
  app:
    build: .
    restart: unless-stopped
    # No "ports" here on purpose. Only Caddy reaches the app, over the internal
    # network at app:9090.
    expose:
      - "9090"
    # Bound memory and CPU so a burst of slow or large evaluations on this public,
    # unauthenticated endpoint cannot exhaust the host and take Caddy down with it.
    mem_limit: 512m
    cpus: 1.0
    environment:
      # Where the memory sidecar lives. The app degrades gracefully if it is
      # unreachable, so this is a soft dependency.
      - AGENT_MEMORY_URL=http://memory:4000
    depends_on:
      - memory
    # The image defines the HEALTHCHECK; Caddy waits for it before starting.

  memory:
    build: ./memory-svc
    restart: unless-stopped
    expose:
      - "4000"
    # The Sui key comes from the environment or a gitignored .env file next to
    # this compose file. Without it the sidecar runs but reports memory as
    # disabled, rather than keeping notes on a container's disk with nothing
    # behind them.
    environment:
      # Identities this service refuses to serve (comma separated), for
      # retiring a compromised or abandoned identity. Set in the same .env.
      - AGENT_MEMORY_RETIRED_USERS=${AGENT_MEMORY_RETIRED_USERS:-}
      # The wallet that pays for everything on Walrus: notes, files, and gas.
      - WALRUS_SUI_KEY=${WALRUS_SUI_KEY:-}
      # MUST be mainnet. The module defaults to testnet, where blobs are cheap
      # and short-lived, and where all 36 of our earlier file blobs expired
      # unrecoverably. A missing value here is a silent data-loss setting.
      - WALRUS_NETWORK=${WALRUS_NETWORK:-mainnet}
      # 0G Storage is the failover for FILE writes only. Notes never touch it.
      - ZERO_G_PRIVATE_KEY=${ZERO_G_PRIVATE_KEY:-}
      # How often the write-ahead buffer is batched into one Walrus quilt.
      - AGENT_MEMORY_FLUSH_INTERVAL_MS=${AGENT_MEMORY_FLUSH_INTERVAL_MS:-}
    mem_limit: 512m
    cpus: 0.5
    # The write-ahead buffer, the read cache, and the quilt index. Losing this
    # volume costs anything not yet flushed; the rest rebuilds from Walrus.
    volumes:
      - agentqa_memdata:/svc/data

  pay:
    build: ./pay
    restart: unless-stopped
    expose:
      - "9100"
    # Internal only, like the memory sidecar. Caddy routes /x402/* here and
    # everything else straight to the app, so the free console never touches the
    # paywall. This service forwards paid calls to the app at app:9090.
    environment:
      - APP_URL=http://app:9090
      # OKX facilitator credentials, from the same gitignored .env as the rest.
      # The service refuses to start without them rather than failing mid-payment.
      - OKX_API_KEY=${OKX_API_KEY:-}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY:-}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE:-}
      # X Layer mainnet, matching the fee denomination on the marketplace listing.
      # Set eip155:1952 for testnet. The address that receives payment has no
      # default on purpose.
      - X402_NETWORK=${X402_NETWORK:-eip155:196}
      - X402_PAY_TO=${X402_PAY_TO:-}
      # Per-call price. Must match the fee on the marketplace listing.
      - X402_PRICE=${X402_PRICE:-}
      # Optional AGON lane. It settles only on Arc Testnet through Circle
      # Gateway and stays unavailable unless explicitly enabled.
      - AGON_X402_ENABLED=${AGON_X402_ENABLED:-false}
      - AGON_X402_PAY_TO=${AGON_X402_PAY_TO:-}
      - AGON_X402_PRICE=${AGON_X402_PRICE:-$0.01}
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  agentqa_memdata:
